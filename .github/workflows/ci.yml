# 260726Cl 追加: push / PR ごとの最小 CI。
#   これまで push/PR で走る workflow は i18n-resx-check.yml だけで、しかもそれは
#   tools/ (メインリポから exclude された独立ローカルリポ) が checkout に入らないため
#   3 検査すべてをスキップして緑になる no-op だった。つまり **通常の C# 変更は一度も
#   ビルドされずに master へ入っていた**。ここを埋めるのが本 workflow の目的。
#
# 意図的にやらないこと (リリース系は release.yml が担当):
#   - Crystallography.Native (C++) のビルド … devenv が要るので PR 単位では回さない
#   - arm64 / WiX MSI / SignPath 署名 / 実機 smoke
#   ここでは「managed が壊れていないか」だけを速く見る。
name: CI

on:
  push:
  pull_request:

# 同一 ref の古い run は打ち切る (PR 連続 push でランナーを食い潰さない)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-x64:
    name: Build (managed, x64 Release)
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive # 共有 lib は git submodule (Crystallography / .Controls / .OpenGL / .Native)

      # 261111Cl: .NET 11 GA. Follow the 11.0 SDK line as global.json does (261106Ch pinned RC 3: "11.0.100-rc.3.26522.148").
      # - name: Setup .NET 10
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          # dotnet-version: "10.0.x"
          dotnet-version: "11.0.x"

      - name: Restore
        run: dotnet restore ReciPro\ReciPro.csproj -p:Platform=x64

      # 260726Cl: TreatWarningsAsErrors は付けない。現状 0 警告だが、
      #   ここで警告を落とすと外部要因 (SDK 更新等) で PR が止まりうる。警告数はログで見る。
      - name: Build
        run: dotnet build ReciPro\ReciPro.csproj -c Release -p:Platform=x64 --no-restore

      # 261118Cl 追加 (作者決定 2026-11-18「動力学計算の最小の独立検査を公開の tests にも置く」): Crystallography の xUnit を走らせる
      #   (約 30 秒、6,700 本余り。流束の保存と RK4 参照の独立検査を含む)。native (C++) はここでは組まないので、テストは managed で動く。
      # 261118Cl 変更 (codex2 第 10 回): 揺れて一度だけ落ちた試験の名前が残らなかったので、TRX (失敗名・スタック・出力) を書き、失敗したときも保存する
      # - name: Test (Crystallography.Tests, managed)
      #   run: dotnet test Crystallography\tests\Crystallography.Tests\Crystallography.Tests.csproj -c Release
      - name: Test (Crystallography.Tests, managed)
        run: dotnet test Crystallography\tests\Crystallography.Tests\Crystallography.Tests.csproj -c Release --logger "trx;LogFileName=crystallography-tests.trx" --results-directory TestResults

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v6 # release.yml と同じ版
        with:
          name: crystallography-tests-trx
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  resx-conventions:
    name: resx conventions (text-only / no baked language / font tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive # Controls の culture resx と Crystallography の SupportedCultures.cs が要る

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 検出専用。修復 (--fix) はローカルの tools/ が担当する (公開リポには出さない方針)。
      # culture 一覧が読めなければ exit 2 で落ちる (黙って一部だけ検査しない)。
      - name: Check resx conventions
        run: python .github/scripts/check_resx_conventions.py
